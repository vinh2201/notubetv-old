name: notubetv Release

on:
  workflow_dispatch:
  push:
    branches: 
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  release:
    name: notubetv Output
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
    - name: Cancel previous runs
      uses: styfle/cancel-workflow-action@0.11.0
    - name: Checkout
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'zulu'
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "latest"
        cache: 'npm'

    - name: Cache Gradle
      uses: burrunan/gradle-cache-action@v1

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Install dependencies
      run: npm install

    # === BƯỚC TỰ ĐỘNG TẠO CHỨNG CHỈ TỰ KÝ (KEYSTORE) ===
    - name: Generate Temporary Keystore
      run: |
        keytool -genkey -v -keystore release.jks \
          -keyalg RSA -keysize 2048 -validity 36500 \
          -alias notubetv-key \
          -storepass notubetv123 \
          -keypass notubetv123 \
          -dname "CN=NoTubeTV, OU=Development, O=NoTubeTV, L=Hanoi, ST=Hanoi, C=VN"

    # === BUILD VÀ KÝ APK TRỰC TIẾP QUA GRADLE (KHÔNG CẦN ACTION PHỤ) ===
    - name: Build and Sign with Gradle
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./gradlew clean generateReleaseFeatureMetadata build \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
          -Pandroid.injected.signing.store.password=notubetv123 \
          -Pandroid.injected.signing.key.alias=notubetv-key \
          -Pandroid.injected.signing.key.password=notubetv123

    - name: Upload Patches Artifact
      uses: actions/upload-artifact@v4
      with:
        name: notubetv-output
        path: |
          app/build/outputs/apk/release/*.apk